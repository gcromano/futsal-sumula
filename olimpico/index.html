<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a3d">
<title>Copa Intermodalidades</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--tx:#14231a;--mut:#5b6b60;--verde:#0f7a3d;--linha:#d8e0d9;
--ouro:#e0a800;--prata:#9aa5ad;--bronze:#b5651d;--erro:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1611;--card:#16211a;--tx:#eaf2ec;--mut:#9db0a2;--linha:#2a3a2f;--verde:#35b36a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#0f7a3d;color:#fff;padding:18px 16px 0}
header h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
header input{background:transparent;border:0;border-bottom:1px dashed #ffffff88;color:#fff;font:inherit;font-weight:800;font-size:1.5rem;width:100%;padding:0 0 2px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav a{color:#ffffffcc;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--verde)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:0 0 10px}
.mut{color:var(--mut);font-size:.9rem}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--linha)}
th{font-size:.8rem;color:var(--mut);font-weight:600}
td.nome,th.nome{text-align:left}
td.pos{width:34px;font-weight:800;color:var(--mut)}
.m{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:4px}
.o{background:var(--ouro)}.p{background:var(--prata)}.b{background:var(--bronze)}
.med{font-weight:700}
.tot{font-weight:800;color:var(--verde)}
select,input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;font-weight:700;padding:9px 14px;border:0;border-radius:8px;background:var(--verde);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--erro);border:1px solid var(--linha);padding:6px 10px}
button.alt{background:transparent;color:var(--verde);border:1px solid var(--verde)}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.linha{display:flex;gap:8px;margin-bottom:10px}
.pod{display:grid;gap:8px;margin-top:10px}
.pod label{display:flex;align-items:center;gap:10px}
.pod select{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{background:var(--card);color:var(--tx);border:1px solid var(--linha)}
.seg button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vazio{text-align:center;color:var(--mut);padding:20px 8px}
.aviso{color:var(--erro);font-size:.85rem;margin:6px 0 0}
</style>
</head>
<body>
<header>
  <input id="nomeCamp" aria-label="Nome do campeonato" maxlength="60">
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script>
const CHAVE = 'copa-intermodalidades-v1';
const PADRAO = {
  nome: 'Copa Intermodalidades 2026',
  regra: 'olimpica',
  equipes: [],
  mods: [
    {id: 'm1', nome: 'Vôlei', emoji: '🏐', ouro: '', prata: '', bronze: ''},
    {id: 'm2', nome: 'Handebol', emoji: '🤾', ouro: '', prata: '', bronze: ''},
    {id: 'm3', nome: 'Basquete', emoji: '🏀', ouro: '', prata: '', bronze: ''}
  ]
};
let S;
try { S = JSON.parse(localStorage.getItem(CHAVE)) || structuredClone(PADRAO); }
catch (e) { S = structuredClone(PADRAO); }

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} };

const ABAS = [['quadro','Quadro de medalhas'],['modalidades','Modalidades'],['equipes','Equipes'],['backup','Backup']];
const aba = () => (location.hash.replace('#/','') || 'quadro');

/* Medalhas: mesma lógica dos Jogos Olímpicos.
   Olímpica: ordena por ouro, depois prata, depois bronze (um ouro vale mais que qualquer quantidade de pratas).
   Pontos: ouro 3, prata 2, bronze 1. */
function quadro() {
  const t = {};
  S.equipes.forEach(e => t[e.id] = {id: e.id, nome: e.nome, o: 0, p: 0, b: 0});
  S.mods.forEach(m => {
    if (t[m.ouro]) t[m.ouro].o++;
    if (t[m.prata]) t[m.prata].p++;
    if (t[m.bronze]) t[m.bronze].b++;
  });
  const lista = Object.values(t).map(x => ({...x, tot: x.o + x.p + x.b, pts: x.o * 3 + x.p * 2 + x.b}));
  lista.sort(S.regra === 'olimpica'
    ? (a, b) => b.o - a.o || b.p - a.p || b.b - a.b || a.nome.localeCompare(b.nome)
    : (a, b) => b.pts - a.pts || b.o - a.o || b.p - a.p || a.nome.localeCompare(b.nome));
  return lista;
}

function vQuadro() {
  const q = quadro().filter(x => x.tot > 0);
  const feitas = S.mods.filter(m => m.ouro).length;
  const regra = S.regra === 'olimpica'
    ? 'Ordem olímpica: vence quem tem mais ouros; empate decide por pratas e depois bronzes.'
    : 'Por pontos: ouro 3, prata 2, bronze 1.';
  return `
  <div class="seg" role="group" aria-label="Critério de classificação">
    <button class="${S.regra==='olimpica'?'on':''}" data-regra="olimpica">Ordem olímpica</button>
    <button class="${S.regra==='pontos'?'on':''}" data-regra="pontos">Por pontos (3-2-1)</button>
  </div>
  <p class="mut">${regra} ${feitas} de ${S.mods.length} modalidades com campeão definido.</p>
  <div class="card">${q.length ? `
    <table><thead><tr><th></th><th class="nome">Equipe</th>
    <th><span class="m o"></span></th><th><span class="m p"></span></th><th><span class="m b"></span></th>
    <th>Total</th>${S.regra==='pontos'?'<th>Pts</th>':''}</tr></thead><tbody>
    ${q.map((x,i)=>`<tr><td class="pos">${i+1}º</td><td class="nome med">${esc(x.nome)}</td>
    <td>${x.o}</td><td>${x.p}</td><td>${x.b}</td><td class="${S.regra==='pontos'?'':'tot'}">${x.tot}</td>
    ${S.regra==='pontos'?`<td class="tot">${x.pts}</td>`:''}</tr>`).join('')}
    </tbody></table>`
    : `<div class="vazio">Nenhuma medalha ainda.<br>Cadastre as equipes e registre o pódio de cada modalidade.</div>`}
  </div>`;
}

function opcoes(sel, bloqueados) {
  return `<option value="">— escolher equipe —</option>` + S.equipes.map(e =>
    `<option value="${e.id}" ${e.id===sel?'selected':''} ${bloqueados.includes(e.id)&&e.id!==sel?'disabled':''}>${esc(e.nome)}</option>`).join('');
}

function vModalidades() {
  const nomeE = id => (S.equipes.find(e => e.id === id) || {}).nome || '';
  return `
  <div class="card"><h2>Nova modalidade</h2>
    <div class="linha"><input type="text" id="mEmoji" value="⚽" style="width:70px" aria-label="Emoji">
    <input type="text" id="mNome" placeholder="Ex.: Futsal, Vôlei de praia, Xadrez" aria-label="Nome da modalidade">
    <button id="addMod">Adicionar</button></div></div>
  ${S.equipes.length < 3 ? `<p class="aviso">Cadastre pelo menos 3 equipes na aba Equipes para montar um pódio.</p>` : ''}
  ${S.mods.map(m => {
    const usados = [m.ouro, m.prata, m.bronze].filter(Boolean);
    return `<div class="card" data-id="${m.id}">
      <div class="topo"><h2>${esc(m.emoji)} ${esc(m.nome)}</h2><button class="sec" data-del-mod="${m.id}">Remover</button></div>
      <div class="pod">
        <label><span class="m o"></span><select data-pod="ouro">${opcoes(m.ouro, usados)}</select></label>
        <label><span class="m p"></span><select data-pod="prata">${opcoes(m.prata, usados)}</select></label>
        <label><span class="m b"></span><select data-pod="bronze">${opcoes(m.bronze, usados)}</select></label>
      </div></div>`;
  }).join('') || '<div class="vazio">Nenhuma modalidade cadastrada.</div>'}`;
}

function vEquipes() {
  return `
  <div class="card"><h2>Nova equipe</h2>
    <div class="linha"><input type="text" id="eNome" placeholder="Ex.: Engenharia, 3º Ano A" aria-label="Nome da equipe">
    <button id="addEq">Adicionar</button></div></div>
  <div class="card">${S.equipes.length ? `<table><tbody>${S.equipes.map(e =>
    `<tr><td class="nome med">${esc(e.nome)}</td><td style="text-align:right"><button class="sec" data-del-eq="${e.id}">Remover</button></td></tr>`).join('')}</tbody></table>`
    : '<div class="vazio">Nenhuma equipe ainda.</div>'}</div>`;
}

function vBackup() {
  return `
  <div class="card"><h2>Backup dos dados</h2>
    <p class="mut">Os dados ficam salvos neste navegador. Baixe um backup para guardar ou levar para outro aparelho.</p>
    <div class="linha"><button id="exp">Baixar backup</button>
    <button class="alt" id="impBtn">Importar backup</button>
    <input type="file" id="imp" accept="application/json" hidden></div>
    <button class="sec" id="zerar">Apagar tudo</button></div>`;
}

function render() {
  const a = ABAS.some(x => x[0] === aba()) ? aba() : 'quadro';
  $('#nav').innerHTML = ABAS.map(([k, n]) => `<a href="#/${k}" class="${k===a?'on':''}">${n}</a>`).join('');
  $('#nomeCamp').value = S.nome;
  $('#app').innerHTML = {quadro: vQuadro, modalidades: vModalidades, equipes: vEquipes, backup: vBackup}[a]();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.regra) { S.regra = t.dataset.regra; }
  else if (t.id === 'addMod') {
    const n = $('#mNome').value.trim(); if (!n) return;
    S.mods.push({id: uid(), nome: n, emoji: $('#mEmoji').value.trim() || '🏅', ouro: '', prata: '', bronze: ''});
  }
  else if (t.dataset.delMod) { if (!confirm('Remover esta modalidade e suas medalhas?')) return; S.mods = S.mods.filter(m => m.id !== t.dataset.delMod); }
  else if (t.id === 'addEq') {
    const n = $('#eNome').value.trim(); if (!n) return;
    S.equipes.push({id: uid(), nome: n});
  }
  else if (t.dataset.delEq) {
    if (!confirm('Remover esta equipe? Ela sai também dos pódios.')) return;
    const id = t.dataset.delEq;
    S.equipes = S.equipes.filter(x => x.id !== id);
    S.mods.forEach(m => ['ouro','prata','bronze'].forEach(k => { if (m[k] === id) m[k] = ''; }));
  }
  else if (t.id === 'exp') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'}));
    a.download = 'backup-copa.json'; a.click(); return;
  }
  else if (t.id === 'impBtn') { $('#imp').click(); return; }
  else if (t.id === 'zerar') { if (!confirm('Apagar todos os dados?')) return; S = structuredClone(PADRAO); }
  else return;
  salvar(); render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pod) {
    const m = S.mods.find(x => x.id === t.closest('[data-id]').dataset.id);
    m[t.dataset.pod] = t.value; salvar(); render();
  } else if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.mods) || !Array.isArray(d.equipes)) throw 0;
        S = d; salvar(); render();
      } catch (x) { alert('Arquivo inválido. Use um backup baixado por este site.'); }
    };
    r.readAsText(t.files[0]);
  }
});

$('#nomeCamp').addEventListener('input', e => { S.nome = e.target.value; document.title = S.nome; salvar(); });
addEventListener('hashchange', render);
document.title = S.nome;
render();
</script>
</body>
</html>
